<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24354a">
<meta name="description" content="POLIS: curso interactivo de teoría política occidental construido sobre el Atlas de Teoría Política.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="systems.css?v=11">
<link rel="stylesheet" href="systems-teaching.css?v=11">
<link rel="stylesheet" href="learning-flow.css?v=11">
<link rel="stylesheet" href="systems-dense.css?v=11">
<link rel="stylesheet" href="systems-speech.css?v=11">
<title>POLIS · Teoría Política Occidental</title>
</head>
<body>
<div id="app">
<header class="topbar">
 <button class="brand" data-tab="route"><span class="mark">Π</span><span><b>POLIS</b><small>teoría política occidental</small></span></button>
 <div class="stats"><span>🔥 <b id="streak">0</b></span><span>⚡ <b id="xp">0</b></span><span>❤️ <b id="hearts">5</b></span></div>
 <button id="settingsBtn" class="settings-top" aria-label="Ajustes" title="Ajustes">⚙️</button>
</header>
<main id="screen"><div class="page" id="polisBoot"><section class="hero"><div class="eyebrow">POLIS</div><h1>Cargando los sistemas canónicos…</h1><p>El núcleo estable se inicia primero; cada autor se valida por separado para no bloquear la aplicación.</p></section></div></main>
<nav class="bottom-nav">
 <button class="nav-btn" data-tab="route">🗺️<span>Ruta</span></button>
 <button class="nav-btn active" id="systemsBtn">🧠<span>Sistemas</span></button>
 <button class="nav-btn" data-tab="works">📚<span>Obras</span></button>
 <button class="nav-btn" data-tab="concepts">🧬<span>Conceptos</span></button>
 <button class="nav-btn" data-tab="compare">⚖️<span>Comparar</span></button>
 <button class="nav-btn" data-tab="practice">🎯<span>Repasar</span></button>
 <button class="nav-btn" data-tab="profile">👤<span>Perfil</span></button>
</nav>
</div>
<div id="modal" class="modal hidden"></div>
<script>
window.POLIS_BOOT_ERROR=null;
window.addEventListener('error',e=>{const where=e.filename?` · ${e.filename.split('/').pop()}:${e.lineno||'?'}:${e.colno||'?'}`:'';window.POLIS_BOOT_ERROR=(e.message||'error de carga')+where;});
</script>
<script src="../data.js"></script>
<script src="../world-context-data.js"></script>
<script src="genealogies.js"></script>
<script src="curriculum.js"></script>
<script src="app-loader.js?v=3"></script>
<script>
setTimeout(()=>{const s=document.getElementById('screen');if(s&&!s.querySelector('.module')&&!s.querySelector('.works-grid')&&!s.querySelector('.concept-grid')&&!s.querySelector('.skill-grid')&&!s.querySelector('.systems-page')&&!s.textContent.includes('Diagnóstico:')){s.innerHTML='<div class="page"><section class="hero"><div class="eyebrow">POLIS</div><h1>La interfaz no pudo iniciar</h1><p>El núcleo no terminó de cargar.</p></section><section class="card"><b>Diagnóstico:</b><p class="note">'+(window.POLIS_BOOT_ERROR||window.POLIS_LEARNING_ERROR||'carga incompleta de recursos')+'</p></section></div>'; }},5200);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=11').catch(()=>{}));
</script>
<script src="enrichment.js"></script>
<script src="systems-data.js?v=11"></script>
<script src="systems-teaching-data.js?v=11"></script>
<script src="systems-discovery-data.js?v=11"></script>
<script src="systems-speech.js?v=11"></script>
<script src="systems-v11-bootstrap.js?v=11"></script>
<script>
window.addEventListener('polis:ready',()=>setTimeout(()=>window.POLIS_SYSTEMS_UI?.renderHome(),0),{once:true});
window.addEventListener('polis:systemsReady',()=>setTimeout(()=>window.POLIS_SYSTEMS_UI?.renderHome(),0),{once:true});
window.addEventListener('polis:v11Ready',e=>{setTimeout(()=>window.POLIS_SYSTEMS_UI?.renderHome(),0);const failures=e.detail?.failures||[];if(failures.length)console.warn('POLIS inició omitiendo módulos:',failures);},{once:true});
setTimeout(()=>{if(window.POLIS_SYSTEMS_UI&&!document.querySelector('.systems-page'))window.POLIS_SYSTEMS_UI.renderHome()},2200);
</script>
</body>
</html>
